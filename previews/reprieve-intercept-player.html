<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reprieve — Compound Risk Bento Demo Studio</title>
  <style>
    :root {
      --bg: #07080c;
      --panel: #0d0e17;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #5B4BE0;
      --cyan: #22D3EE;
      --rose: #BE123C;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 16px 28px;
      background: rgba(13, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(91, 75, 224, 0.2);
      color: #c7d2fe;
      border: 1px solid rgba(91, 75, 224, 0.4);
    }

    .status-pill {
      font-size: 12px;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 28px 80px;
      gap: 20px;
    }

    .toolbar {
      width: 100%;
      max-width: 1280px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: #191b2b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #23263b;
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.primary {
      background: var(--accent);
      border-color: #7c6ee6;
    }

    button.primary:hover {
      background: #4a3bbd;
    }

    .zoom-ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    input[type="range"] {
      accent-color: var(--cyan);
      cursor: pointer;
    }

    /* Viewer Stage */
    .stage-container {
      width: 100%;
      max-width: 1280px;
      background: #040508;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(91, 75, 224, 0.05);
    }

    .ambient-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: radial-gradient(circle, rgba(91, 75, 224, 0.16) 0%, rgba(34, 211, 238, 0.06) 50%, transparent 80%);
      filter: blur(60px);
      pointer-events: none;
    }

    .viewport {
      width: 1200px;
      height: 680px;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }

    .viewport object {
      width: 100%;
      height: 100%;
      border-radius: 16px;
    }

    /* Timeline & Frame Inspector */
    .timeline-bar {
      width: 100%;
      max-width: 1280px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .timecode {
      font-family: 'SF Mono', Consolas, monospace;
      color: var(--cyan);
      font-weight: 600;
    }

    .scrubber-track {
      width: 100%;
      height: 6px;
      background: #1a1d2e;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--rose));
      border-radius: 3px;
      position: relative;
    }

    .scrubber-head {
      position: absolute;
      right: -6px;
      top: -5px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
      cursor: grab;
    }

    .code-badge {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 11px;
      background: #141624;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="badge">Section Demo</span>
      <h1 style="font-size: 16px; font-weight: 600;">Exceptions are approved alone. Risk compounds across the graph.</h1>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Clean Bento Layout Ready</span>
    </div>
  </header>

  <main>
    <!-- Controls Toolbar -->
    <div class="toolbar">
      <div class="btn-group">
        <button id="btnPlayPause" class="primary">
          <span id="playIcon">⏸</span> <span id="playLabel">Pause</span>
        </button>
        <button id="btnRestart">↺ Restart</button>
        <button id="btnStepBack">⏮ -0.5s</button>
        <button id="btnStepForward">⏭ +0.5s</button>
      </div>

      <div class="zoom-ctrl">
        <span>🔍 Camera Zoom:</span>
        <input type="range" id="zoomRange" min="0.7" max="2.0" step="0.05" value="1.0">
        <span id="zoomLabel" class="code-badge">1.00x</span>
        <button id="btnResetZoom" style="padding: 4px 8px; font-size: 11px;">Reset</button>
      </div>

      <div class="btn-group">
        <span style="color: var(--text-muted); font-size: 12px; margin-right: 4px;">Pacing:</span>
        <button class="speed-btn" data-speed="0.5" style="padding: 4px 8px; font-size: 11px;">0.5x</button>
        <button class="speed-btn primary" data-speed="1.0" style="padding: 4px 8px; font-size: 11px;">1x (Fast/Smooth)</button>
        <button class="speed-btn" data-speed="1.5" style="padding: 4px 8px; font-size: 11px;">1.5x</button>
      </div>
    </div>

    <!-- Main Live Stage -->
    <div class="stage-container" id="stageContainer">
      <div class="ambient-glow"></div>
      
      <!-- Primary Viewport -->
      <div class="viewport" id="viewport">
        <object id="svgObject" data="reprieve-intercept.svg" type="image/svg+xml"></object>
      </div>
    </div>

    <!-- Timeline & Inspector -->
    <div class="timeline-bar">
      <div class="timeline-header">
        <div style="display: flex; gap: 12px; align-items: center;">
          <span style="font-weight: 600;">Timeline Position:</span>
          <span id="timecode" class="timecode">00:00:00.00 / 00:00:03.60</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <span style="color: var(--text-muted); font-size: 12px;">Cycle: 3.6s Seamless Loop</span>
        </div>
      </div>
      <div class="scrubber-track" id="scrubberTrack">
        <div class="scrubber-fill" id="scrubberFill">
          <div class="scrubber-head"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const viewport = document.getElementById('viewport');
    const zoomRange = document.getElementById('zoomRange');
    const zoomLabel = document.getElementById('zoomLabel');
    const btnResetZoom = document.getElementById('btnResetZoom');
    const svgObject = document.getElementById('svgObject');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    const btnRestart = document.getElementById('btnRestart');
    const timecode = document.getElementById('timecode');
    const scrubberFill = document.getElementById('scrubberFill');
    const scrubberTrack = document.getElementById('scrubberTrack');
    const stageContainer = document.getElementById('stageContainer');

    let currentZoom = 1.0;
    let isPlaying = true;
    let playbackSpeed = 1.0;
    let duration = 3.6; // 3.6 seconds seamless loop
    let currentTime = 0;
    let animFrame = null;
    let lastTimestamp = performance.now();

    function setZoom(val) {
      currentZoom = parseFloat(val);
      viewport.style.transform = `scale(${currentZoom})`;
      zoomRange.value = currentZoom;
      zoomLabel.textContent = currentZoom.toFixed(2) + 'x';
    }

    zoomRange.addEventListener('input', (e) => setZoom(e.target.value));
    btnResetZoom.addEventListener('click', () => setZoom(1.0));

    stageContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY * -0.001;
      const newZoom = Math.min(Math.max(currentZoom + delta, 0.7), 2.0);
      setZoom(newZoom);
    }, { passive: false });

    function updateLoop(timestamp) {
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime = (currentTime + dt * playbackSpeed) % duration;
        updateUI();
      }
      animFrame = requestAnimationFrame(updateLoop);
    }
    animFrame = requestAnimationFrame(updateLoop);

    function updateUI() {
      const pct = (currentTime / duration) * 100;
      scrubberFill.style.width = `${pct}%`;
      const s = Math.floor(currentTime);
      const ms = Math.floor((currentTime % 1) * 100);
      timecode.textContent = `00:00:0${s}.${ms.toString().padStart(2, '0')} / 00:00:03.60`;
    }

    btnPlayPause.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.textContent = '⏸';
        playLabel.textContent = 'Pause';
      } else {
        playIcon.textContent = '▶';
        playLabel.textContent = 'Play';
      }
    });

    btnRestart.addEventListener('click', () => {
      currentTime = 0;
      svgObject.data = svgObject.data;
      updateUI();
    });

    document.getElementById('btnStepBack').addEventListener('click', () => {
      currentTime = (currentTime - 0.5 + duration) % duration;
      updateUI();
    });

    document.getElementById('btnStepForward').addEventListener('click', () => {
      currentTime = (currentTime + 0.5) % duration;
      updateUI();
    });

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('primary'));
        btn.classList.add('primary');
        playbackSpeed = parseFloat(btn.dataset.speed);
      });
    });

    scrubberTrack.addEventListener('click', (e) => {
      const rect = scrubberTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.min(Math.max(clickX / rect.width, 0), 1);
      currentTime = pct * duration;
      updateUI();
    });
  </script>
</body>
</html>
