<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reprieve Intercept Video Stage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06070a;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 50% 40%, #151128 0%, #08090f 50%, #030406 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient cyber dust & aurora glow */
    .aurora-glow {
      position: absolute;
      width: 1100px;
      height: 700px;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(91, 75, 224, 0.28) 0%, rgba(34, 211, 238, 0.12) 45%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* Grid overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }

    /* Cinematic Camera Rig */
    #camera-rig {
      position: relative;
      width: 960px;
      height: 840px;
      transform-origin: 520px 480px;
      will-change: transform;
    }

    #camera-rig iframe, #camera-rig object {
      width: 100%;
      height: 100%;
      border: none;
      filter: drop-shadow(0 30px 70px rgba(0, 0, 0, 0.95));
    }

    /* HUD Watermark & Pacing Telemetry */
    .hud-telemetry {
      position: absolute;
      bottom: 36px;
      left: 48px;
      right: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 10;
    }

    .telemetry-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .telemetry-badge {
      background: rgba(91, 75, 224, 0.15);
      border: 1px solid rgba(91, 75, 224, 0.4);
      color: #c7d2fe;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
    }

    .telemetry-pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px #22d3ee;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="grid-overlay"></div>
    <div class="aurora-glow"></div>

    <!-- Camera Rig -->
    <div id="camera-rig">
      <object id="svgDoc" data="reprieve-intercept.svg" type="image/svg+xml" style="width: 100%; height: 100%;"></object>
    </div>

    <!-- Telemetry Bar -->
    <div class="hud-telemetry">
      <div class="telemetry-left">
        <span class="telemetry-badge"><span class="telemetry-pulse"></span>REPRIEVE MCP INTERCEPT ENGINE</span>
        <span>LATENCY: 11.8MS</span>
        <span>GRAPHS: PLATFORM // ORG // MEM</span>
      </div>
      <div>
        <span>FPS: 60 // PUSH-IN ZOOM: DYNAMIC // CIP-04</span>
      </div>
    </div>
  </div>

  <script>
    const rig = document.getElementById('camera-rig');

    // Deterministic seek function for frame-by-frame rendering
    window.seekTime = function(t, duration = 7.0) {
      const progress = (t % duration) / duration;
      
      // Calculate dynamic camera push-in:
      // 0.0 -> 0.2: 1.0x
      // 0.2 -> 0.35: push in from 1.0x to 1.12x
      // 0.35 -> 0.8: hold at 1.16x with micro Lissajous drift
      // 0.8 -> 0.95: smooth pull back to 1.0x
      let scale = 1.0;
      let tx = 0;
      let ty = 0;

      if (progress < 0.2) {
        scale = 1.0;
      } else if (progress < 0.35) {
        const ease = (progress - 0.2) / 0.15;
        // smooth cubic ease
        const f = ease * ease * (3 - 2 * ease);
        scale = 1.0 + f * 0.14;
        tx = -f * 30;
        ty = -f * 40;
      } else if (progress < 0.8) {
        const f = (progress - 0.35) / 0.45;
        scale = 1.14 + Math.sin(f * Math.PI) * 0.02;
        tx = -30 - Math.sin(f * 2) * 5;
        ty = -40;
      } else if (progress < 0.95) {
        const ease = (progress - 0.8) / 0.15;
        const f = 1 - (ease * ease * (3 - 2 * ease));
        scale = 1.0 + f * 0.14;
        tx = -f * 30;
        ty = -f * 40;
      } else {
        scale = 1.0;
      }

      rig.style.transform = `scale(${scale}) translate(${tx}px, ${ty}px)`;
    };
  </script>
</body>
</html>
