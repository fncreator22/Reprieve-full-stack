<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reprieve Compound Risk Bento Stage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #06070a;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 50% 50%, #110d22 0%, #07080d 60%, #040507 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient deep aurora glow */
    .aurora-glow {
      position: absolute;
      width: 1200px;
      height: 750px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(91, 75, 224, 0.22) 0%, rgba(190, 18, 60, 0.1) 45%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* Perfectly centered Bento Rig */
    #camera-rig {
      position: relative;
      width: 1200px;
      height: 680px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.95));
    }

    #camera-rig svg {
      width: 1200px;
      height: 680px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="aurora-glow"></div>
    <div id="camera-rig">
      <svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg_ambient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#141126" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#090A0F" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="aurora_left" cx="25%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#5B4BE0" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora_right" cx="75%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#BE123C" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#5B4BE0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Borders -->
    <linearGradient id="card_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(91, 75, 224, 0.28)"/>
    </linearGradient>

    <linearGradient id="alert_border_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="card_shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="cursor_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
  <![CDATA[
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* =========================================================================
       5.0s SEAMLESS LOOP ORCHESTRATION (300 Frames @ 60 FPS)
       Phase 1 (0.0s - 0.4s | 0-8%): Snappy Staggered Spring Reveal
       Phase 2 (0.4s - 1.8s | 8-36%): Scrubber Drag & Collision Detonation
       Phase 3 (1.8s - 2.8s | 36-56%): Cross-Graph Cascade & Risk Score Surges
       Phase 4 (2.8s - 3.8s | 56-76%): Steward Precedent Recall & Button Depress
       Phase 5 (3.8s - 4.6s | 76-92%): Showcase Hold
       Phase 6 (4.6s - 5.0s | 92-100%): Snappy Dissolve & Seamless Loop Reset
       ========================================================================= */

    /* Cards Spring Reveal (Phase 1) and Vanish (Phase 6) */
    @keyframes cards_lifecycle_A {
      0% { opacity: 0; transform: translateY(12px) scale(0.98); }
      7% { opacity: 1; transform: translateY(0px) scale(1); }
      92% { opacity: 1; transform: translateY(0px) scale(1); }
      98% { opacity: 0; transform: translateY(-8px) scale(0.99); }
      100% { opacity: 0; transform: translateY(12px) scale(0.98); }
    }

    @keyframes cards_lifecycle_B {
      0%, 2% { opacity: 0; transform: translateY(12px) scale(0.98); }
      9% { opacity: 1; transform: translateY(0px) scale(1); }
      92% { opacity: 1; transform: translateY(0px) scale(1); }
      98% { opacity: 0; transform: translateY(-8px) scale(0.99); }
      100% { opacity: 0; transform: translateY(12px) scale(0.98); }
    }

    @keyframes cards_lifecycle_C {
      0%, 4% { opacity: 0; transform: translateY(12px) scale(0.98); }
      11% { opacity: 1; transform: translateY(0px) scale(1); }
      92% { opacity: 1; transform: translateY(0px) scale(1); }
      98% { opacity: 0; transform: translateY(-8px) scale(0.99); }
      100% { opacity: 0; transform: translateY(12px) scale(0.98); }
    }

    /* Slider Thumb Movement (0.7s to 1.5s = 14% to 30%) */
    @keyframes slider_thumb_motion {
      0%, 14% { transform: translateX(0px); }
      28%, 76% { transform: translateX(151px); }
      90%, 100% { transform: translateX(0px); }
    }

    @keyframes slider_bar_fill {
      0%, 14% { width: 30px; }
      28%, 76% { width: 181px; }
      90%, 100% { width: 30px; }
    }

    /* Collision Detonation Banner in Card B (Detonates at t=1.2s / 24%) */
    @keyframes collision_banner_detonate {
      0%, 23% { opacity: 0; transform: translateY(6px); }
      28%, 78% { opacity: 1; transform: translateY(0px); }
      88%, 100% { opacity: 0; transform: translateY(6px); }
    }

    /* Row 01 Cascade Pulse in Card A */
    @keyframes row1_cascade_pulse {
      0%, 35% { background: #121319; stroke: rgba(255,255,255,0.05); }
      38%, 76% { stroke: #F43F5E; filter: drop-shadow(0 0 8px rgba(244,63,94,0.4)); }
      88%, 100% { stroke: rgba(255,255,255,0.05); filter: none; }
    }

    /* Risk Score Value Surges from 42.0 to 82.4 */
    @keyframes risk_score_surge {
      0%, 35% { fill: #E2E8F0; filter: none; }
      42%, 78% { fill: #F43F5E; filter: drop-shadow(0 0 10px #f43f5e); }
      88%, 100% { fill: #E2E8F0; filter: none; }
    }

    /* Card C Action Button Depress (Click at t=3.2s / 64%) */
    @keyframes btn_depress_click {
      0%, 62% { transform: scale(1); filter: brightness(1); }
      65% { transform: scale(0.94); filter: brightness(1.25) drop-shadow(0 0 8px rgba(34,211,238,0.5)); }
      70%, 100% { transform: scale(1); filter: brightness(1); }
    }

    /* Cursor Flight Director */
    @keyframes cursor_choreography {
      0% {
        transform: translate(1100px, 640px);
        opacity: 0;
      }
      8% {
        /* Enters and approaches slider thumb */
        transform: translate(820px, 135px);
        opacity: 1;
      }
      14% {
        /* Grabs slider thumb at Today */
        transform: translate(796px, 117px) scale(0.9);
        opacity: 1;
      }
      28% {
        /* Drags thumb to 30 Days */
        transform: translate(947px, 117px) scale(0.9);
        opacity: 1;
      }
      34% {
        /* Releases thumb */
        transform: translate(955px, 122px) scale(1);
        opacity: 1;
      }
      54% {
        /* Moves down to Card C button */
        transform: translate(947px, 577px) scale(1);
        opacity: 1;
      }
      65% {
        /* Depresses button */
        transform: translate(947px, 577px) scale(0.85);
        opacity: 1;
      }
      72% {
        transform: translate(947px, 577px) scale(1);
        opacity: 1;
      }
      84% {
        /* Drifts aside for showcase */
        transform: translate(1120px, 630px);
        opacity: 0;
      }
      100% {
        transform: translate(1100px, 640px);
        opacity: 0;
      }
    }

    #card_A_group {
      animation: cards_lifecycle_A 5.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #card_B_group {
      animation: cards_lifecycle_B 5.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #card_C_group {
      animation: cards_lifecycle_C 5.0s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    #slider_thumb {
      animation: slider_thumb_motion 5.0s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    #slider_bar_active {
      animation: slider_bar_fill 5.0s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    #collision_alert_box {
      animation: collision_banner_detonate 5.0s ease-out infinite;
    }

    #row1_surface {
      animation: row1_cascade_pulse 5.0s ease-in-out infinite;
    }

    #risk_score_value {
      animation: risk_score_surge 5.0s ease-out infinite;
    }

    #btn_review_action {
      transform-origin: 181px 17px;
      animation: btn_depress_click 5.0s cubic-bezier(0.3, 1.5, 0.5, 1) infinite;
    }

    #cursor_director {
      animation: cursor_choreography 5.0s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
  ]]>
  </style>

  <script>
    const rig = document.getElementById('camera-rig');

    // Smooth subtle camera drift tied to the 5.0s cycle
    window.seekTime = function(t, duration = 5.0) {
      const progress = (t % duration) / duration;
      
      let scale = 1.0;
      let tx = 0;
      let ty = 0;

      if (progress < 0.08) {
        scale = 1.0;
      } else if (progress < 0.36) {
        const ease = (progress - 0.08) / 0.28;
        const f = ease * ease * (3 - 2 * ease);
        scale = 1.0 + f * 0.03;
        tx = -f * 12;
        ty = -f * 8;
      } else if (progress < 0.76) {
        scale = 1.03;
        tx = -12;
        ty = -8;
      } else if (progress < 0.92) {
        const ease = (progress - 0.76) / 0.16;
        const f = 1 - (ease * ease * (3 - 2 * ease));
        scale = 1.0 + f * 0.03;
        tx = -f * 12;
        ty = -f * 8;
      } else {
        scale = 1.0;
        tx = 0;
        ty = 0;
      }

      rig.style.transform = `scale(${scale}) translate(${tx}px, ${ty}px)`;
    };

    // Synchronize Camera Rig in lockstep with CSS animation clock
    let startTimestamp = null;
    function loop(timestamp) {
      if (!startTimestamp) startTimestamp = timestamp;
      const elapsed = (timestamp - startTimestamp) / 1000;
      window.seekTime(elapsed, 5.0);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
