# Reprieve Local Infrastructure Stack (FalkorDB v4.22.0 + FastAPI)
# Updated: October 15, 2026 (Hackathon Launch Edition)
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0   # pinned, see docs/spike-notes.md
    ports: ["6379:6379", "3005:3000"]  # 3005 = FalkorDB Browser (3000 is the web app)
    volumes: [falkordb-data:/var/lib/falkordb/data]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    ports: ["8000:8000"]
    depends_on: [falkordb]
volumes:
  falkordb-data:
