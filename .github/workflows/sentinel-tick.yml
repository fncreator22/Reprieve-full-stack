# Reprieve Sentinel Autonomous Tick Workflow (October 15, 2026)
name: sentinel-tick
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "$INTERNAL_TICK_SECRET" ]; then
            echo "INTERNAL_TICK_SECRET secret not configured in repo; skipping sentinel scheduled tick."
            exit 0
          fi
          TARGET_URL="${API_URL:-https://reprieve-backend.onrender.com}"
          curl -fsS --max-time 120 -X POST "$TARGET_URL/internal/sentinel/tick" -H "X-Internal-Secret: $INTERNAL_TICK_SECRET"
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_TICK_SECRET: ${{ secrets.INTERNAL_TICK_SECRET }}
