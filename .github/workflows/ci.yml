name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.0
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Seed bundle is deterministic and committed
        run: python3 scripts/generate_seed.py && git diff --exit-code data/
      - name: Lint, types, tests
        working-directory: backend
        run: uv sync --frozen && uv run ruff check . && uv run mypy && uv run pytest -q
      - name: Eval (recall, false positives, calibration, latency)
        working-directory: backend
        run: uv run python ../eval/run_eval.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json  # pnpm version comes from its packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
