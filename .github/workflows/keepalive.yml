name: keepalive
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 120 "$API_URL/health"
          curl -fsS --max-time 60 "$API_URL/internal/health/deep" -H "X-Internal-Secret: $INTERNAL_TICK_SECRET"
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_TICK_SECRET: ${{ secrets.INTERNAL_TICK_SECRET }}
