# Reprieve Keepalive Ping Workflow (October 15, 2026)
name: keepalive
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TARGET_URL="${API_URL:-https://reprieve-backend.onrender.com}"
          echo "Pinging health at $TARGET_URL/health"
          curl -fsS --max-time 120 "$TARGET_URL/health" || true
          if [ -n "$INTERNAL_TICK_SECRET" ]; then
            curl -fsS --max-time 60 "$TARGET_URL/internal/health/deep" -H "X-Internal-Secret: $INTERNAL_TICK_SECRET" || true
          fi
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_TICK_SECRET: ${{ secrets.INTERNAL_TICK_SECRET }}
