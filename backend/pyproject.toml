[project]
name = "reprieve-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.0",
    "falkordb>=1.7.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.23.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "svix>=2.6.1",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-cachetools>=7.0.0.20260713",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
